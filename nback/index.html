<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>N-back · 心智训练站</title>
		<meta name="description" content="单位置 N-back 工作记忆训练：当前刺激与 n 步前位置相同时按空格。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/base.css" />
		<script>
			document.documentElement.classList.remove('no-js');
		</script>
		<style>
			/* ---------- N-back 专属 ---------- */
			.nflag {
				font-family: var(--font-num);
				font-size: 26px;
				font-weight: 700;
				color: var(--mod);
				line-height: 1;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				max-width: 340px;
				margin: 26px auto;
			}
			/* 格子 = 白瓦，亮起 = 涂满模块色 */
			.cell {
				aspect-ratio: 1;
				border-radius: var(--radius-s);
				background: var(--surface);
				border: 1px solid var(--line);
				transition: background 0.1s, border-color 0.1s;
			}
			.cell.lit {
				background: var(--mod);
				border-color: var(--mod);
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--mod) 20%, transparent);
			}
			/* 按键判定闪色：盖满全盘软色，刺激已灭时也能看见反馈 */
			.grid.judge-ok .cell {
				background: var(--good-soft);
				border-color: var(--good);
			}
			.grid.judge-bad .cell {
				background: var(--bad-soft);
				border-color: var(--bad);
			}
			.grid.judge-ok .cell.lit {
				background: var(--good);
			}
			.grid.judge-bad .cell.lit {
				background: var(--bad);
			}
			.match-note {
				text-align: center;
				color: var(--ink-3);
				font-size: 13.5px;
				margin: 6px 0 16px;
			}
		</style>
	</head>
	<body class="mod-nback">
		<header class="topbar">
			<nav class="nav" aria-label="主导航">
				<a class="brand" href="/">
					<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="5" cy="7.5" r="2.7" fill="var(--m-math)" />
						<circle cx="12" cy="7.5" r="2.7" fill="var(--m-schulte)" />
						<circle cx="19" cy="7.5" r="2.7" fill="var(--m-span)" />
						<circle cx="5" cy="16.5" r="2.7" fill="var(--m-nback)" />
						<circle cx="12" cy="16.5" r="2.7" fill="var(--m-stroop)" />
						<circle cx="19" cy="16.5" r="2.7" fill="var(--m-meditation)" />
					</svg>
					心智训练站
				</a>
				<div class="nav-links">
					<a href="/">首页</a>
					<a href="/math/">心算</a>
					<a href="/nback/" aria-current="page">N-back</a>
					<a href="/schulte/">舒尔特</a>
					<a href="/stroop/">色词</a>
					<a href="/span/">序列</a>
					<a href="/meditation/">冥想</a>
					<a href="/stats/">统计</a>
				</div>
				<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
					<svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7" /><path d="M19 6a8.5 8.5 0 0 1 0 12" />
					</svg>
					<svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9l4 6M21 9l-4 6" />
					</svg>
				</button>
			</nav>
		</header>

		<main class="container">
			<div class="page-head">
				<span class="wm" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<g stroke="currentColor" stroke-width="1.2">
							<rect x="2.5" y="2.5" width="4.6" height="4.6" rx="1.3" />
							<rect x="9.7" y="2.5" width="4.6" height="4.6" rx="1.3" />
							<rect x="16.9" y="2.5" width="4.6" height="4.6" rx="1.3" />
							<rect x="2.5" y="9.7" width="4.6" height="4.6" rx="1.3" />
							<rect x="16.9" y="9.7" width="4.6" height="4.6" rx="1.3" />
							<rect x="2.5" y="16.9" width="4.6" height="4.6" rx="1.3" />
							<rect x="9.7" y="16.9" width="4.6" height="4.6" rx="1.3" />
							<rect x="16.9" y="16.9" width="4.6" height="4.6" rx="1.3" />
						</g>
						<rect x="9.7" y="9.7" width="4.6" height="4.6" rx="1.3" fill="currentColor" />
					</svg>
				</span>
				<span class="ability-pill">工作记忆</span>
				<h1>N-back</h1>
				<p class="sub">单位置记忆：亮起的位置与 n 步前相同时按空格，不同就不按。</p>
			</div>

			<div class="js-warn">N-back 需要启用 JavaScript，否则无法训练。</div>

			<!-- 开局配置 -->
			<section class="card" id="setup">
				<h2>选择 n 值</h2>
				<div class="seg-title">n 值（回溯几步）</div>
				<div class="seg" id="seg-n">
					<button data-value="1" aria-pressed="false">1</button>
					<button data-value="2" aria-pressed="true">2</button>
					<button data-value="3" aria-pressed="false">3</button>
					<button data-value="4" aria-pressed="false">4</button>
					<button data-value="5" aria-pressed="false">5</button>
				</div>
				<div class="seg-title num" id="trial-info"></div>
				<div style="margin-top: 18px">
					<button class="btn big" id="btn-start">开始训练</button>
				</div>
			</section>

			<!-- 训练进行中 -->
			<section class="card board" id="game" hidden>
				<div class="game-top">
					<span class="nflag num" id="nflag"></span>
					<span class="progress-line num" id="progress"></span>
				</div>
				<div class="grid" id="grid">
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
				</div>
				<div class="match-note" id="match-note"></div>
				<button class="btn big" id="btn-match" disabled>匹配（空格）</button>
			</section>

			<!-- 结果 -->
			<section class="card" id="result" hidden>
				<h2>本轮成绩</h2>
				<div class="result-cells num">
					<div class="hl"><div class="v" id="r-acc">0%</div><div class="l">准确率</div></div>
					<div><div class="v" id="r-hit">0</div><div class="l">命中</div></div>
					<div><div class="v" id="r-miss">0</div><div class="l">漏报</div></div>
					<div><div class="v" id="r-fa">0</div><div class="l">误报</div></div>
				</div>
				<p class="best-line" id="r-best"></p>
				<p class="hint">命中 = 有目标按了；漏报 = 有目标没按；误报 = 没目标按了。</p>
				<div class="result-actions">
					<button class="btn" id="btn-again">再来一轮</button>
					<a class="btn ghost" href="/stats/">看统计</a>
				</div>
			</section>
		</main>

		<script type="module" src="/assets/js/nback/game.js"></script>
	</body>
</html>
