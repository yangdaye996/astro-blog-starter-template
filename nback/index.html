<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>N-back · 心智训练站</title>
		<meta name="description" content="单位置 N-back 工作记忆训练：当前刺激与 n 步前位置相同时按空格。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/base.css" />
		<script>
			document.documentElement.classList.remove('no-js');
		</script>
		<style>
			/* ---------- N-back 专属 ---------- */
			.game-top {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
			}
			.nflag {
				font-size: 15px;
				font-weight: 700;
				color: var(--accent);
			}
			.progress-line {
				color: var(--ink-3);
				font-size: 14px;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				max-width: 320px;
				margin: 22px auto;
			}
			.cell {
				aspect-ratio: 1;
				border-radius: var(--radius-s);
				background: var(--surface-2);
				border: 1px solid var(--line);
				transition: background 0.1s;
			}
			.cell.lit {
				background: var(--accent);
				border-color: var(--accent);
				box-shadow: 0 0 0 4px var(--accent-soft);
			}
			/* 按键判定闪色：盖满全盘软色， stimulus 已灭时也能看见反馈 */
			.grid.judge-ok .cell {
				background: var(--good-soft);
				border-color: var(--good);
			}
			.grid.judge-bad .cell {
				background: var(--bad-soft);
				border-color: var(--bad);
			}
			.grid.judge-ok .cell.lit {
				background: var(--good);
				box-shadow: 0 0 0 4px var(--good-soft);
			}
			.grid.judge-bad .cell.lit {
				background: var(--bad);
				box-shadow: 0 0 0 4px var(--bad-soft);
			}
			.match-note {
				text-align: center;
				color: var(--ink-3);
				font-size: 13.5px;
				margin: 6px 0 14px;
			}
			.result-grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				margin: 14px 0 4px;
				text-align: center;
			}
			.result-grid .v {
				font-size: 24px;
				font-weight: 800;
				color: var(--ink);
			}
			.result-grid .l {
				font-size: 12.5px;
				color: var(--ink-3);
			}
			.result-grid .acc .v {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<header class="topbar">
			<nav class="nav">
				<a class="brand" href="/">心智训练站</a>
				<a href="/">首页</a>
				<a href="/math/">心算</a>
				<a href="/nback/" aria-current="page">N-back</a>
				<a href="/meditation/">冥想</a>
				<a href="/stats/">统计</a>
			</nav>
		</header>

		<main class="container">
			<div class="page-head">
				<h1>N-back</h1>
				<p class="sub">单位置记忆：亮起的位置与 n 步前相同时按空格，不同就不按。</p>
			</div>

			<div class="js-warn">N-back 需要启用 JavaScript，否则无法训练。</div>

			<!-- 开局配置 -->
			<section class="card" id="setup">
				<h2>选择 n 值</h2>
				<div class="seg-title">n 值（回溯几步）</div>
				<div class="seg" id="seg-n">
					<button data-value="1" aria-pressed="false">1</button>
					<button data-value="2" aria-pressed="true">2</button>
					<button data-value="3" aria-pressed="false">3</button>
					<button data-value="4" aria-pressed="false">4</button>
					<button data-value="5" aria-pressed="false">5</button>
				</div>
				<div class="seg-title num" id="trial-info"></div>
				<div style="margin-top: 18px">
					<button class="btn big" id="btn-start">开始训练</button>
				</div>
			</section>

			<!-- 训练进行中 -->
			<section class="card" id="game" hidden>
				<div class="game-top">
					<span class="nflag num" id="nflag"></span>
					<span class="progress-line num" id="progress"></span>
				</div>
				<div class="grid" id="grid">
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
					<div class="cell"></div>
				</div>
				<div class="match-note" id="match-note"></div>
				<button class="btn big" id="btn-match" disabled>匹配（空格）</button>
			</section>

			<!-- 结果 -->
			<section class="card" id="result" hidden>
				<h2>本轮成绩</h2>
				<div class="result-grid num">
					<div><div class="v" id="r-acc">0%</div><div class="l">准确率</div></div>
					<div><div class="v" id="r-hit">0</div><div class="l">命中</div></div>
					<div><div class="v" id="r-miss">0</div><div class="l">漏报</div></div>
					<div><div class="v" id="r-fa">0</div><div class="l">误报</div></div>
				</div>
				<p class="hint">命中 = 有目标按了；漏报 = 有目标没按；误报 = 没目标按了。</p>
				<div style="display: flex; gap: 10px">
					<button class="btn" id="btn-again">再来一轮</button>
					<a class="btn ghost" href="/stats/" style="text-decoration: none; text-align: center">看统计</a>
				</div>
			</section>
		</main>

		<script type="module" src="/assets/js/nback/game.js"></script>
	</body>
</html>
