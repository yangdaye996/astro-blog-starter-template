<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>冥想 · 心智训练站</title>
		<meta name="description" content="极简静坐计时器：可选呼吸引导，结束时一声钟。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/base.css" />
		<script>
			document.documentElement.classList.remove('no-js');
		</script>
		<style>
			/* ---------- 冥想专属 ---------- */
			.stage {
				position: relative;
				text-align: center;
				padding: 10px 0 6px;
			}
			.progress-track {
				height: 3px;
				border-radius: 999px;
				background: var(--surface-2);
				overflow: hidden;
				margin-bottom: 8px;
			}
			.progress-bar {
				height: 100%;
				width: 0%;
				background: var(--accent);
				transition: width 0.3s linear;
			}
			.remain {
				font-size: 64px;
				font-weight: 800;
				color: var(--ink);
				margin: 10px 0 4px;
				line-height: 1;
			}
			.ball-wrap {
				height: 250px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			/* 呼吸球 = 水墨晕染的圆，随呼吸涨落（渐变仅此处使用） */
			.ball {
				position: relative;
				width: 150px;
				height: 150px;
				border-radius: 50%;
				background: radial-gradient(
					circle at 50% 44%,
					rgb(32 38 58 / 0.88) 0%,
					rgb(32 38 58 / 0.64) 55%,
					rgb(32 38 58 / 0.1) 78%,
					transparent 82%
				);
				animation: breathe 8s ease-in-out infinite;
				will-change: transform;
			}
			/* 涟漪：墨圈随吸气外扩再淡去，一圈比一圈轻 */
			.ball::before,
			.ball::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 1.5px solid rgb(32 38 58 / 0.26);
				pointer-events: none;
				animation: ripple 8s ease-out infinite;
			}
			.ball::after {
				animation-delay: 4s;
				border-color: rgb(44 67 196 / 0.2);
			}
			@keyframes ripple {
				0% {
					transform: scale(0.55);
					opacity: 0;
				}
				25% {
					opacity: 0.9;
				}
				55%,
				100% {
					transform: scale(1.4);
					opacity: 0;
				}
			}
			@keyframes breathe {
				0% {
					transform: scale(0.62);
				}
				50% {
					transform: scale(1);
				}
				100% {
					transform: scale(0.62);
				}
			}
			.breath-word {
				font-size: 22px;
				font-weight: 700;
				color: var(--accent);
				letter-spacing: 0.3em;
				text-indent: 0.3em; /* 抵消末字间距，视觉居中 */
			}
			.count-in {
				font-size: 80px;
				font-weight: 800;
				color: var(--accent);
				line-height: 1;
			}
			.result-num {
				font-size: 44px;
				font-weight: 800;
				color: var(--accent);
			}
			@media (prefers-reduced-motion: reduce) {
				.ball,
				.ball::before,
				.ball::after {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<header class="topbar">
			<nav class="nav">
				<a class="brand" href="/">心智训练站</a>
				<a href="/">首页</a>
				<a href="/math/">心算</a>
				<a href="/nback/">N-back</a>
				<a href="/meditation/" aria-current="page">冥想</a>
				<a href="/stats/">统计</a>
			</nav>
		</header>

		<main class="container">
			<div class="page-head">
				<span class="wm" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="44 10" transform="rotate(-55 12 12)" />
					</svg>
				</span>
				<h1>冥想</h1>
				<p class="sub">静坐计时，结束时一声钟。可开呼吸引导。</p>
			</div>

			<div class="js-warn">冥想计时需要启用 JavaScript。</div>

			<!-- 开局配置 -->
			<section class="card" id="setup">
				<h2>选择时长与引导</h2>
				<div class="seg-title">时长</div>
				<div class="seg" id="seg-min">
					<button data-value="5" aria-pressed="true">5 分钟</button>
					<button data-value="10" aria-pressed="false">10 分钟</button>
					<button data-value="15" aria-pressed="false">15 分钟</button>
					<button data-value="20" aria-pressed="false">20 分钟</button>
				</div>
				<div class="seg-title">呼吸引导</div>
				<div class="seg" id="seg-breath">
					<button data-value="on" aria-pressed="true">开（4 秒吸 / 4 秒呼）</button>
					<button data-value="off" aria-pressed="false">关</button>
				</div>
				<div style="margin-top: 18px">
					<button class="btn big" id="btn-start">开始静坐</button>
				</div>
			</section>

			<!-- 进行中 -->
			<section class="card board" id="game" hidden>
				<div class="stage">
					<div class="progress-track"><div class="progress-bar" id="progress"></div></div>
					<div class="remain num" id="remain">05:00</div>
					<div class="ball-wrap" id="ball-wrap">
						<div class="count-in num" id="count-in" hidden></div>
						<div class="ball" id="ball" hidden></div>
						<div class="breath-word" id="breath-word" hidden>吸</div>
					</div>
				</div>
				<div style="text-align: center; margin-top: 6px">
					<button class="btn ghost" id="btn-abort">结束本次</button>
				</div>
			</section>

			<!-- 结果 -->
			<section class="card" id="result" hidden>
				<h2>本次记录</h2>
				<div class="result-num num" id="r-min">0 分钟</div>
				<p class="result-line num" id="r-detail"></p>
				<p class="hint">已写入本地记录。</p>
				<div style="display: flex; gap: 10px">
					<button class="btn" id="btn-again">再来一次</button>
					<a class="btn ghost" href="/stats/" style="text-decoration: none; text-align: center">看统计</a>
				</div>
			</section>
		</main>

		<script type="module" src="/assets/js/meditation/session.js"></script>
	</body>
</html>
