<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>冥想 · 心智训练站</title>
		<meta name="description" content="极简静坐计时器：可选呼吸引导，结束时一声钟。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/base.css" />
		<script>
			document.documentElement.classList.remove('no-js');
		</script>
		<style>
			/* ---------- 冥想专属 ---------- */
			.stage {
				position: relative;
				text-align: center;
				padding: 10px 0 6px;
			}
			.progress-track {
				height: 4px;
				border-radius: 999px;
				background: var(--surface-2);
				overflow: hidden;
				margin-bottom: 8px;
			}
			.progress-bar {
				height: 100%;
				width: 0%;
				background: var(--mod);
				border-radius: 999px;
				transition: width 0.3s linear;
			}
			.remain {
				font-family: var(--font-num);
				font-variant-numeric: tabular-nums;
				font-size: 64px;
				font-weight: 700;
				color: var(--ink);
				margin: 10px 0 4px;
				line-height: 1;
			}
			.ball-wrap {
				height: 250px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			/* 呼吸球 = 松石绿晕染的圆，随呼吸涨落 */
			.ball {
				position: relative;
				width: 150px;
				height: 150px;
				border-radius: 50%;
				background: radial-gradient(
					circle at 50% 44%,
					rgb(12 166 120 / 0.9) 0%,
					rgb(12 166 120 / 0.62) 55%,
					rgb(12 166 120 / 0.1) 78%,
					transparent 82%
				);
				animation: breathe 8s ease-in-out infinite;
				will-change: transform;
			}
			/* 涟漪：绿圈随吸气外扩再淡去，一圈比一圈轻 */
			.ball::before,
			.ball::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 1.5px solid rgb(12 166 120 / 0.3);
				pointer-events: none;
				animation: ripple 8s ease-out infinite;
			}
			.ball::after {
				animation-delay: 4s;
				border-color: rgb(16 152 173 / 0.24);
			}
			@keyframes ripple {
				0% { transform: scale(0.55); opacity: 0; }
				25% { opacity: 0.9; }
				55%, 100% { transform: scale(1.4); opacity: 0; }
			}
			@keyframes breathe {
				0% { transform: scale(0.62); }
				50% { transform: scale(1); }
				100% { transform: scale(0.62); }
			}
			.breath-word {
				font-size: 22px;
				font-weight: 700;
				color: var(--mod);
				letter-spacing: 0.3em;
				text-indent: 0.3em; /* 抵消末字间距，视觉居中 */
			}
			.count-in {
				font-family: var(--font-num);
				font-size: 80px;
				font-weight: 700;
				color: var(--mod);
				line-height: 1;
			}
			@media (prefers-reduced-motion: reduce) {
				.ball,
				.ball::before,
				.ball::after {
					animation: none;
				}
			}
		</style>
	</head>
	<body class="mod-meditation">
		<header class="topbar">
			<nav class="nav" aria-label="主导航">
				<a class="brand" href="/">
					<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="5" cy="7.5" r="2.7" fill="var(--m-math)" />
						<circle cx="12" cy="7.5" r="2.7" fill="var(--m-schulte)" />
						<circle cx="19" cy="7.5" r="2.7" fill="var(--m-span)" />
						<circle cx="5" cy="16.5" r="2.7" fill="var(--m-nback)" />
						<circle cx="12" cy="16.5" r="2.7" fill="var(--m-stroop)" />
						<circle cx="19" cy="16.5" r="2.7" fill="var(--m-meditation)" />
					</svg>
					心智训练站
				</a>
				<div class="nav-links">
					<a href="/">首页</a>
					<a href="/math/">心算</a>
					<a href="/nback/">N-back</a>
					<a href="/schulte/">舒尔特</a>
					<a href="/stroop/">色词</a>
					<a href="/span/">序列</a>
					<a href="/meditation/" aria-current="page">冥想</a>
					<a href="/stats/">统计</a>
				</div>
				<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
					<svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7" /><path d="M19 6a8.5 8.5 0 0 1 0 12" />
					</svg>
					<svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9l4 6M21 9l-4 6" />
					</svg>
				</button>
			</nav>
		</header>

		<main class="container">
			<div class="page-head">
				<span class="wm" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="44 10" transform="rotate(-55 12 12)" />
					</svg>
				</span>
				<span class="ability-pill">平静专注</span>
				<h1>冥想</h1>
				<p class="sub">静坐计时，结束时一声钟。可开呼吸引导，跟着圆球一吸一呼。</p>
			</div>

			<div class="js-warn">冥想计时需要启用 JavaScript。</div>

			<!-- 开局配置 -->
			<section class="card" id="setup">
				<h2>选择时长与引导</h2>
				<div class="seg-title">时长</div>
				<div class="seg" id="seg-min">
					<button data-value="5" aria-pressed="true">5 分钟</button>
					<button data-value="10" aria-pressed="false">10 分钟</button>
					<button data-value="15" aria-pressed="false">15 分钟</button>
					<button data-value="20" aria-pressed="false">20 分钟</button>
				</div>
				<div class="seg-title">呼吸引导</div>
				<div class="seg" id="seg-breath">
					<button data-value="on" aria-pressed="true">开（4 秒吸 / 4 秒呼）</button>
					<button data-value="off" aria-pressed="false">关</button>
				</div>
				<div style="margin-top: 18px">
					<button class="btn big" id="btn-start">开始静坐</button>
				</div>
			</section>

			<!-- 进行中 -->
			<section class="card board" id="game" hidden>
				<div class="stage">
					<div class="progress-track"><div class="progress-bar" id="progress"></div></div>
					<div class="remain num" id="remain">05:00</div>
					<div class="ball-wrap" id="ball-wrap">
						<div class="count-in num" id="count-in" hidden></div>
						<div class="ball" id="ball" hidden></div>
						<div class="breath-word" id="breath-word" hidden>吸</div>
					</div>
				</div>
				<div style="text-align: center; margin-top: 6px">
					<button class="btn ghost" id="btn-abort">结束本次</button>
				</div>
			</section>

			<!-- 结果 -->
			<section class="card" id="result" hidden>
				<h2>本次记录</h2>
				<div class="score num" id="r-min">0 分钟</div>
				<p class="score-line num" id="r-detail"></p>
				<p class="best-line" id="r-best"></p>
				<div class="result-actions">
					<button class="btn" id="btn-again">再来一次</button>
					<a class="btn ghost" href="/stats/">看统计</a>
				</div>
			</section>
		</main>

		<script type="module" src="/assets/js/meditation/session.js"></script>
	</body>
</html>
