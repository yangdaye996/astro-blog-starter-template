<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>心算 · 心智训练站</title>
		<meta name="description" content="限时心算冲刺：三档难度，倒计时内答对尽可能多的题。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/base.css" />
		<script>
			document.documentElement.classList.remove('no-js');
		</script>
		<style>
			/* ---------- 心算专属 ---------- */
			.question {
				text-align: center;
				font-family: var(--font-num);
				font-variant-numeric: tabular-nums;
				font-size: clamp(44px, 12vw, 62px);
				font-weight: 700;
				margin: 28px 0 6px;
				letter-spacing: 0.03em;
				line-height: 1.15;
			}
			/* 作答 = 一条模块色墨线，答在线上 */
			.entry-line {
				text-align: center;
				font-family: var(--font-num);
				font-variant-numeric: tabular-nums;
				font-size: 34px;
				font-weight: 700;
				color: var(--ink-2);
				min-height: 52px;
				border-bottom: 2.5px solid var(--mod);
				width: 7ch;
				margin: 0 auto 10px;
			}
			.feedback {
				text-align: center;
				min-height: 30px;
				font-size: 16px;
				font-weight: 700;
			}
			.feedback.ok { color: var(--good); }
			.feedback.err { color: var(--bad); }
			.keypad {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				max-width: 330px;
				margin: 16px auto 0;
			}
			.keypad button {
				font: inherit;
				font-family: var(--font-num);
				font-size: 21px;
				font-weight: 600;
				padding: 14px 0;
				border-radius: var(--radius-s);
				border: 1px solid var(--line);
				background: var(--surface);
				color: var(--ink);
				cursor: pointer;
				font-variant-numeric: tabular-nums;
				transition: border-color 0.15s, background 0.15s;
			}
			.keypad button:hover {
				border-color: var(--mod);
			}
			.keypad button:active {
				transform: translateY(1px);
				background: var(--mod-soft);
			}
			.keypad button.wide {
				grid-column: 1 / -1;
				background: var(--mod);
				border-color: transparent;
				color: #fff;
				font-family: var(--font);
				font-size: 16px;
			}
			.keypad button.wide:hover {
				background: color-mix(in srgb, var(--mod) 86%, #10142a);
			}
			.keypad button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body class="mod-math">
		<header class="topbar">
			<nav class="nav" aria-label="主导航">
				<a class="brand" href="/">
					<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="5" cy="7.5" r="2.7" fill="var(--m-math)" />
						<circle cx="12" cy="7.5" r="2.7" fill="var(--m-schulte)" />
						<circle cx="19" cy="7.5" r="2.7" fill="var(--m-span)" />
						<circle cx="5" cy="16.5" r="2.7" fill="var(--m-nback)" />
						<circle cx="12" cy="16.5" r="2.7" fill="var(--m-stroop)" />
						<circle cx="19" cy="16.5" r="2.7" fill="var(--m-meditation)" />
					</svg>
					心智训练站
				</a>
				<div class="nav-links">
					<a href="/">首页</a>
					<a href="/math/" aria-current="page">心算</a>
					<a href="/nback/">N-back</a>
					<a href="/schulte/">舒尔特</a>
					<a href="/stroop/">色词</a>
					<a href="/span/">序列</a>
					<a href="/meditation/">冥想</a>
					<a href="/stats/">统计</a>
				</div>
				<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
					<svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7" /><path d="M19 6a8.5 8.5 0 0 1 0 12" />
					</svg>
					<svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9l4 6M21 9l-4 6" />
					</svg>
				</button>
			</nav>
		</header>

		<main class="container">
			<div class="page-head">
				<span class="wm" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.4" />
						<path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
					</svg>
				</span>
				<span class="ability-pill">计算速度</span>
				<h1>心算</h1>
				<p class="sub">限时冲刺：倒计时内键入答案，答对尽可能多。</p>
			</div>

			<div class="js-warn">心算需要启用 JavaScript，否则无法训练。</div>

			<!-- 开局配置 -->
			<section class="card" id="setup">
				<h2>选择难度与时长</h2>
				<div class="seg-title">难度档</div>
				<div class="seg" id="seg-level">
					<button data-value="1" aria-pressed="true">L1 入门</button>
					<button data-value="2" aria-pressed="false">L2 进阶</button>
					<button data-value="3" aria-pressed="false">L3 挑战</button>
				</div>
				<div class="seg-title">时长</div>
				<div class="seg" id="seg-seconds">
					<button data-value="30" aria-pressed="false">30 秒</button>
					<button data-value="60" aria-pressed="true">60 秒</button>
					<button data-value="120" aria-pressed="false">120 秒</button>
				</div>
				<div class="seg-title">题型随档位升级：L1 两位×一位 → L2 两位×两位（积三位）→ L3 两位×两位（积四位）</div>
				<p class="hint">开始后可直接用物理键盘作答：数字键输入，回车提交，不必点屏上键盘。</p>
				<div style="margin-top: 18px">
					<button class="btn big" id="btn-start">开始训练</button>
				</div>
			</section>

			<!-- 训练进行中 -->
			<section class="card board" id="game" hidden>
				<div class="game-top">
					<span class="timer num" id="timer">60</span>
					<span class="progress-line num" id="progress">第 1 题</span>
				</div>
				<div class="time-track"><div class="time-bar" id="time-bar"></div></div>
				<div class="question num" id="question"></div>
				<div class="entry-line num" id="entry"></div>
				<div class="feedback" id="feedback"></div>
				<div class="keypad" id="keypad">
					<button data-key="1">1</button>
					<button data-key="2">2</button>
					<button data-key="3">3</button>
					<button data-key="4">4</button>
					<button data-key="5">5</button>
					<button data-key="6">6</button>
					<button data-key="7">7</button>
					<button data-key="8">8</button>
					<button data-key="9">9</button>
					<button data-key="skip">跳过</button>
					<button data-key="0">0</button>
					<button data-key="back">退格</button>
					<button class="wide" data-key="submit">提交（回车）</button>
				</div>
				<p class="kbd-hint">
					<kbd>0</kbd>–<kbd>9</kbd> 输入 · <kbd>Enter</kbd> 提交 · <kbd>Backspace</kbd> 退格 · <kbd>S</kbd> 跳过
				</p>
			</section>

			<!-- 结果 -->
			<section class="card" id="result" hidden>
				<h2>本轮成绩</h2>
				<div class="score num" id="r-correct">0 题</div>
				<p class="score-line num" id="r-detail"></p>
				<p class="best-line" id="r-best"></p>
				<div class="result-actions">
					<button class="btn" id="btn-again">再来一轮</button>
					<a class="btn ghost" href="/stats/">看统计</a>
				</div>
			</section>
		</main>

		<script type="module" src="/assets/js/math/game.js"></script>
	</body>
</html>
